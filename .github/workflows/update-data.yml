name: Update Insider Data

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      - run: python scripts/pipeline.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-data-full.js app-prices.js vietstock-insider-raw.json vietstock-migrated.json
          git commit -m "auto: refresh insider data" || echo "no changes"
          git push
