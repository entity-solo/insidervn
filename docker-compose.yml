services:
  # --- API (stateless, horizontally scalable) ---
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/insidervn.db}
      - SOURCE_DIR=/app/reference
      - REDIS_URL=${REDIS_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      # Only used when DATABASE_URL points to a local sqlite file.
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- Pipeline worker (owns all DB writes; separate from the API) ---
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scripts.run_worker", "--schedule"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/insidervn.db}
      - SOURCE_DIR=/app/reference
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # --- Frontend (Next.js) ---
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://api:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    environment:
      # Runtime port for the Next server inside the container
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
